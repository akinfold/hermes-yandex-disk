# Hermes Agent plugin manifest.
name: yandex-disk
version: "0.5.2"
description: "Browse, search, read, write, share, delete and restore files on Yandex Disk over the REST API. Requires YANDEX_DISK_OAUTH_TOKEN; YANDEX_DISK_ROOT confines Disk paths to one folder and YANDEX_DISK_ACTIONS restricts which tools are exposed."
author: akinfold
kind: standalone
# The oldest Hermes the install check runs against. An older Hermes refuses to
# load the plugin.
requires_hermes: ">=0.21.5"
# Every tool register() may offer. yadisk_search is offered only when a probe
# at load shows the token may use Yandex' search endpoint, so a token that may
# not gets one tool fewer than this list.
provides_tools:
  - yadisk_disk_info
  - yadisk_list
  - yadisk_search
  - yadisk_read_file
  - yadisk_trash_list
  - yadisk_download
  - yadisk_mkdir
  - yadisk_write_file
  - yadisk_upload
  - yadisk_copy
  - yadisk_move
  - yadisk_trash_restore
  - yadisk_publish
  - yadisk_delete
  - yadisk_trash_empty
# `hermes plugins install` asks for each of these that ~/.hermes/.env lacks.
# Hermes reads `name`, `description`, `url` and `secret`, and drops an entry
# without a `name`.
requires_env:
  - name: YANDEX_DISK_OAUTH_TOKEN
    description: "Yandex Disk OAuth token (scopes: cloud_api:disk.info, cloud_api:disk.read, cloud_api:disk.write)"
    url: "https://yandex.ru/dev/disk/poligon/"
    secret: true
