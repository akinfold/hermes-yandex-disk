# Hermes Agent plugin manifest.
name: yandex-disk
version: "0.1.0"
description: "Browse, read, write and share files on Yandex Disk. Requires YANDEX_DISK_OAUTH_TOKEN."
author: akinfold
kind: standalone
provides_tools:
  - yadisk_disk_info
  - yadisk_list
  - yadisk_search
  - yadisk_read_file
  - yadisk_trash_list
  - yadisk_download
  - yadisk_mkdir
  - yadisk_write_file
  - yadisk_upload
  - yadisk_copy
  - yadisk_move
  - yadisk_trash_restore
  - yadisk_publish
  - yadisk_delete
  - yadisk_trash_empty
requires_env:
  - key: YANDEX_DISK_OAUTH_TOKEN
    prompt: "Yandex Disk OAuth token (scopes: cloud_api:disk.info, cloud_api:disk.read, cloud_api:disk.write)"
    url: "https://yandex.ru/dev/disk/poligon/"
