# On tag v*. Publishing to PyPI is opt-in: set the repository variable
# PUBLISH_TO_PYPI=true and configure a PyPI Trusted Publisher for the `pypi`
# environment and this workflow filename. No API token is involved.
name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  # Installs the very artifacts built above into a real Hermes, every way the
  # README documents. Nothing is released or published unless it passes.
  install-check:
    name: Install check
    needs: build
    uses: ./.github/workflows/install-check.yml

  github-release:
    name: GitHub Release
    needs: [build, install-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --generate-notes

  pypi-publish:
    name: Publish to PyPI
    needs: [build, install-check]
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Keep only Python distributions
        run: rm -f dist/*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
