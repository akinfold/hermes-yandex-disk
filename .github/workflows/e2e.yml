# Manual live E2E. These tests create, publish and permanently delete real files
# on the account whose token lives in the `yandex-disk-e2e` environment — point it
# at a throwaway Yandex account, never a personal one.
#
# The plugin runs inside a real Hermes, installed by its official installer (see
# .github/actions/setup-hermes): the latest release by default, or main, which
# is what the installer gives today. The tests run in Hermes' own Python with
# this checkout and pytest on PYTHONPATH: nothing is installed into Hermes'
# environment, which Hermes builds itself and does not support changing by hand.
# `none` runs the plugin on its own, on the stand-ins in _compat.py.
name: E2E (live)

on:
  workflow_dispatch:
    inputs:
      hermes:
        description: "Hermes to run the plugin in"
        type: choice
        options: [release, main, none]
        default: release

permissions:
  contents: read

jobs:
  e2e:
    name: Live end-to-end tests
    runs-on: ubuntu-latest
    environment: yandex-disk-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Hermes with its official installer
        id: hermes
        if: inputs.hermes != 'none'
        uses: ./.github/actions/setup-hermes
        with:
          channel: ${{ inputs.hermes }}
      - name: Give Hermes' Python the plugin and pytest, without installing into Hermes
        if: inputs.hermes != 'none'
        env:
          HERMES_PYTHON: ${{ steps.hermes.outputs.python }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --target "$RUNNER_TEMP/e2e-site" pytest
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/e2e-site"
          # Hermes' own code, or a failed run: never a quiet fallback to the stand-ins.
          "$HERMES_PYTHON" -c "from hermes_yandex_disk._compat import HERMES_AVAILABLE; assert HERMES_AVAILABLE, 'the plugin cannot import Hermes'"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "E2E_PYTHON=$HERMES_PYTHON" >> "$GITHUB_ENV"
      - name: Install the plugin on its own
        if: inputs.hermes == 'none'
        run: |
          python -m pip install -e '.[dev]'
          echo "E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run live E2E tests
        env:
          YANDEX_DISK_OAUTH_TOKEN: ${{ secrets.YANDEX_DISK_OAUTH_TOKEN }}
          YANDEX_DISK_E2E_LOGIN: ${{ secrets.YANDEX_DISK_E2E_LOGIN }}
        run: '"$E2E_PYTHON" -m pytest tests/e2e -m e2e -v -p no:cacheprovider'
